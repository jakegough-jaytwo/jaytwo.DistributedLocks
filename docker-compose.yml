services:

  postgres:
    image: postgres:latest
    profiles:
      - "testernet"
    expose:
      - "5432"
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: pgdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:latest
    profiles:
      - "testernet"
    expose:
      - "3306"
    command: --bind-address=0.0.0.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydb
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypass
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:latest
    profiles:
      - "testernet"
    expose:
      - "6379"
    command: redis-server --requirepass redpass
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redpass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
