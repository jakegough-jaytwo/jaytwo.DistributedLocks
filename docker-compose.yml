services:

  postgres-localdev:
    build:
      context: ./db
      dockerfile: Dockerfile.postgres
    restart: always
    profiles:
      - "localdev"
    ports:
      - "45432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d pgdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql-localdev:
    build:
      context: ./db
      dockerfile: Dockerfile.mysql
    restart: always
    profiles:
      - "localdev"
    ports:
      - "43306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  sqlserver-localdev:
    build:
      context: ./db
      dockerfile: Dockerfile.sqlserver
    restart: always
    profiles:
      - "localdev"
    ports:
      - "41433:1433"
    healthcheck:
      test: ["CMD-SHELL", "sqlcmd -S localhost -C -U sa -P $$MSSQL_SA_PASSWORD -l 1 -Q 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-localdev:
    build:
      context: ./db
      dockerfile: Dockerfile.redis
    restart: always
    profiles:
      - "localdev"
    ports:
      - "46379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redpass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile.postgres
    profiles:
      - "testernet"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d pgdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    build:
      context: ./db
      dockerfile: Dockerfile.mysql
    profiles:
      - "testernet"
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  sqlserver:
    build:
      context: ./db
      dockerfile: Dockerfile.sqlserver
    profiles:
      - "testernet"
    expose:
      - "1433"
    healthcheck:
      test: ["CMD-SHELL", "sqlcmd -S localhost -C -U sa -P $$MSSQL_SA_PASSWORD -l 1 -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    build:
      context: ./db
      dockerfile: Dockerfile.redis
    restart: always
    profiles:
      - "testernet"
    ports:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redpass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
